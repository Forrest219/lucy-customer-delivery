# 这是参数示例（NOT installable values）
# 请按贵司自有 Helm Chart / GitOps 抄用相关字段；本文件不能直接 `helm install`。
# 字段名与参考 chart reference/helm-chart/values.yaml 对齐，便于对照。
#
# 交付版本: lucy-k8s-integration-20260827-v1
# 镜像: project-lucy:customer-amd64-0.16.0 (linux/amd64)
# KTX: @kaelio/ktx@0.16.0

image:
  repository: REPLACE-ME-registry.example.com/data-team/project-lucy
  tag: "customer-amd64-0.16.0"
  pullPolicy: IfNotPresent   # 无 registry、节点已 docker load 时可改为 Never
imagePullSecrets: []         # 私有 registry 时填 dockerconfigjson Secret 名

replicaCount: 1              # 硬约束：不得改为 >1

# Deployment strategy 必须为 Recreate（配合 RWO PVC）；在贵司 chart 中保证。

service:
  type: ClusterIP
  webuiPort: 5174
  mcpPort: 7879
  # 严禁把 7878 加入 Service ports

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: REPLACE-ME-storage-class

env:
  LUCY_PUBLIC_MCP_URL: "REPLACE-ME-https://lucy.example.com/mcp"
  LUCY_ALLOW_PLACEHOLDER_KTX: ""   # 生产必须空；首次 seed 可临时设 "1"
  KTX_PROJECT_ROOT: /data/lucy
  POSTHOG_DISABLED: "1"

existingSecret: REPLACE-ME-lucy-db-secrets
extraSecretData: {}                # 生产必须空；勿把明文密码写进 values

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: lucy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

startupProbe:
  exec:
    command:
      - /app/scripts/docker-healthcheck.sh
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 15
  failureThreshold: 60

readinessProbe:
  exec:
    command:
      - /app/scripts/docker-healthcheck.sh
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /api/health
    port: webui
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
